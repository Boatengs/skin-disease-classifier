name: probe
on:
  push:
    branches: [lesion-split-upgrade]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: CPU speed test
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          cat > speed.py <<'PY'
          import torch, time, torchvision
          torch.set_num_threads(4)
          m = torchvision.models.efficientnet_b0(weights='IMAGENET1K_V1')
          x = torch.randn(32, 3, 224, 224)
          m.eval()
          with torch.no_grad():
              m(x); t = time.time(); m(x); m(x); print('infer img/s', 64 / (time.time() - t))
          for p in m.parameters(): p.requires_grad = False
          for p in m.features[-3:].parameters(): p.requires_grad = True
          for p in m.classifier.parameters(): p.requires_grad = True
          m.train(); opt = torch.optim.AdamW([p for p in m.parameters() if p.requires_grad], 1e-3)
          opt.zero_grad(); m(x).sum().backward(); opt.step()
          t = time.time()
          for _ in range(3):
              opt.zero_grad(); m(x).sum().backward(); opt.step()
          print('train img/s (last3)', 96 / (time.time() - t))
          PY
          python speed.py
      - name: Zip download speed
        run: |
          t=$(date +%s)
          curl -sSL -o p1.zip "https://dataverse.harvard.edu/api/access/datafile/3172585" -w "%{http_code} %{size_download}\n"
          echo secs $(( $(date +%s) - t ))
          unzip -l p1.zip | tail -2

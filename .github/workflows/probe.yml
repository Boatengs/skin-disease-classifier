name: probe
on:
  push:
    branches: [lesion-split-upgrade]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q pandas scikit-learn scipy numpy && pip install -q --no-deps -e .
      - run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          from skinclf.data import download, load_metadata
          download(Path("data"), metadata_only=True)
          m = load_metadata(Path("data/HAM10000_metadata.csv"))
          p = np.load("results/runs/image-s42/predictions.npz")
          les = m.lesion_id.to_numpy()
          t = p["test_rows"]
          seen = np.isin(les[t], les[p["train_rows"]])
          d = m.dx.to_numpy()[t]
          import pandas as pd
          print(pd.crosstab(d, np.where(seen, "seen", "new")))
          print("nv share seen", (d[seen] == "nv").mean(), "new", (d[~seen] == "nv").mean())
          multi = m.groupby("lesion_id").size()
          m["photos"] = m.lesion_id.map(multi)
          print(pd.crosstab(m.dx, m.photos > 1, normalize="index"))
          print(pd.crosstab(m.dx_type, m.photos > 1))
          PY
